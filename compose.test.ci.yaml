name: hronaut-tests

services:
  integration:
    build:
      context: .
      dockerfile: Dockerfile.test
    init: true
    ipc: host
    environment:
      CI: "true"
      HRONAUT_INTEGRATION_SHARDS: "${HRONAUT_INTEGRATION_SHARDS:-6}"
      HRONAUT_INTEGRATION_SKIP_TYPECHECK: "${HRONAUT_INTEGRATION_SKIP_TYPECHECK:-false}"
