<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; font-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hronaut</title>
  </head>
  <body>
    <main class="startup-notice" role="alertdialog" aria-labelledby="startup-notice-title" aria-describedby="startup-notice-message startup-notice-detail">
      <header class="startup-notice__header">
        <!-- Material Symbols error-outline-rounded, as Hronaut's own dialogs draw an error. -->
        <span class="startup-notice__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12.713 16.713Q13 16.425 13 16t-.288-.712T12 15t-.712.288T11 16t.288.713T12 17t.713-.288m0-4Q13 12.425 13 12V8q0-.425-.288-.712T12 7t-.712.288T11 8v4q0 .425.288.713T12 13t.713-.288M12 22q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12t.788-3.9t2.137-3.175T8.1 2.788T12 2t3.9.788t3.175 2.137T21.213 8.1T22 12t-.788 3.9t-2.137 3.175t-3.175 2.138T12 22m0-2q3.35 0 5.675-2.325T20 12t-2.325-5.675T12 4T6.325 6.325T4 12t2.325 5.675T12 20m0-8" /></svg>
        </span>
        <div class="startup-notice__heading">
          <span class="startup-notice__eyebrow">Hronaut</span>
          <h1 id="startup-notice-title"></h1>
        </div>
      </header>
      <div class="startup-notice__body">
        <p id="startup-notice-message" class="startup-notice__message"></p>
        <p id="startup-notice-detail"></p>
      </div>
      <footer class="startup-notice__footer">
        <button id="startup-notice-quit" type="button" autofocus></button>
      </footer>
    </main>
    <script type="module" src="/src/startup-notice.ts"></script>
  </body>
</html>
