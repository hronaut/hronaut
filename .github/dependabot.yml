version: 2

multi-ecosystem-groups:
  playwright:
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Kyiv"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@playwright/test"
      # electron-vite 5 supports Vite only through 7. Remove when its peer range includes Vite 8.
      - dependency-name: "vite"
        versions:
          - "8.x"
      # typescript-eslint 8 supports TypeScript below 6.1. Remove when it supports TypeScript 7.
      - dependency-name: "typescript"
        versions:
          - "7.x"
      # Electron 44.4.x shifts trusted controls after compact navigation; 44.4.1 also crashes continuity QA.
      - dependency-name: "electron"
        versions:
          - "44.4.x"
    groups:
      production-minor-patch:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    patterns:
      - "@playwright/test"
    multi-ecosystem-group: "playwright"

  - package-ecosystem: "docker"
    directory: "/"
    patterns:
      - "mcr.microsoft.com/playwright"
    multi-ecosystem-group: "playwright"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
