version: 2

# One weekly pull request carries every npm update together with the Playwright Docker image, which must stay on the
# locked Playwright version (tests/docker-playwright-version.test.ts); GitHub Actions updates get one of their own.
multi-ecosystem-groups:
  dependencies:
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kyiv"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"
    ignore:
      # typescript-eslint 8 supports TypeScript below 6.1. Remove when it supports TypeScript 7.
      - dependency-name: "typescript"
        versions:
          - "7.x"

  # Without an allow list, an entry that joins a multi-ecosystem group opens a pull request of its own for every other
  # dependency it finds. Dependabot names an image without its registry: mcr.microsoft.com/playwright is "playwright".
  - package-ecosystem: "docker"
    directory: "/"
    allow:
      - dependency-name: "playwright"
    patterns:
      - "playwright"
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
