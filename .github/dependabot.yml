version: 2

multi-ecosystem-groups:
  playwright:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Kyiv"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@playwright/test"
    groups:
      production-minor-patch:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 10
    patterns:
      - "@playwright/test"
    multi-ecosystem-group: "playwright"

  - package-ecosystem: "docker"
    directory: "/"
    open-pull-requests-limit: 10
    patterns:
      - "mcr.microsoft.com/playwright"
    multi-ecosystem-group: "playwright"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
