name: VS Code extension

# Builds the Hronaut extension for VS Code and Open VSX as a .vsix artifact. Run from main with
# "Publish to Open VSX" checked, it also publishes that .vsix to Open VSX with the OVSX_PAT token of the
# extension-stores environment. The VS Code Marketplace gets the .vsix from the publisher's own account.
on:
  workflow_dispatch:
    inputs:
      open_vsx:
        description: Publish to Open VSX (main only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # vsce-sign's install script only downloads the signing tool, which packaging does not use.
      - name: Install vsce
        run: npm install --global --ignore-scripts @vscode/vsce@4.0.0

      # The store pages show the README from the package, so its relative links point at this commit's folder.
      - name: Package the extension
        working-directory: extensions/vscode
        env:
          CONTENT_URL: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/extensions/vscode
          IMAGES_URL: https://github.com/${{ github.repository }}/raw/${{ github.sha }}/extensions/vscode
        run: >-
          vsce package --no-dependencies --baseContentUrl "$CONTENT_URL" --baseImagesUrl "$IMAGES_URL"
          --out "hronaut-vscode-$(node -p "require('./package.json').version").vsix"

      - name: Upload the extension
        uses: actions/upload-artifact@v7
        with:
          name: hronaut-vscode
          path: extensions/vscode/*.vsix
          if-no-files-found: error

  publish-open-vsx:
    needs: package
    if: inputs.open_vsx
    runs-on: ubuntu-latest
    environment: extension-stores
    steps:
      - name: Check the branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Only builds of main go to Open VSX; this run is on $GITHUB_REF." >&2
          exit 1

      - name: Download the extension
        uses: actions/download-artifact@v8
        with:
          name: hronaut-vscode

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install ovsx
        run: npm install --global --ignore-scripts ovsx@1.3.0

      # The first publish creates the namespace, which makes the token's account its owner.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "$OVSX_PAT" ]]; then
            echo "Add the Open VSX access token as the OVSX_PAT secret of the extension-stores environment." >&2
            exit 1
          fi
          vsix="$(ls hronaut-vscode-*.vsix)"
          namespace="$(unzip -p "$vsix" extension/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).publisher")"
          if ! curl --silent --fail --output /dev/null "https://open-vsx.org/api/$namespace"; then
            ovsx create-namespace "$namespace"
          fi
          ovsx publish --packagePath "$vsix" --skip-duplicate
