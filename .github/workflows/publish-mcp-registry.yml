name: Publish MCP Registry

on:
  workflow_call:
    inputs:
      tag:
        description: Immutable published Hronaut release tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable published Hronaut release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mcp-registry-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mcp-registry-publish
    permissions:
      attestations: read
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_LINUX_AMD64_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
      REGISTRY_URL: https://registry.modelcontextprotocol.io
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Validate the selected mainline release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          tag_sha="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "$tag_sha" ]]; then
            echo "Checkout does not match immutable tag commit $tag_sha." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "Registry publication requires a release tag on origin/main." >&2
            exit 1
          fi

          version="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match package version v$version." >&2
            exit 1
          fi

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets > "$RUNNER_TEMP/hronaut-mcp-release.json"
          jq -e --arg tag "$TAG" '
            .tagName == $tag and
            .isDraft == false and
            .isPrerelease == false
          ' "$RUNNER_TEMP/hronaut-mcp-release.json" >/dev/null

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"

      - name: Download and verify published MCPB metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TAG_SHA: ${{ steps.release.outputs.tag_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir registry-release
          mcpb="hronaut-mcp-adapter-$VERSION.mcpb"
          metadata="hronaut-mcp-server.json"
          hashes="hashes.txt"

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$mcpb" \
            --pattern "$metadata" \
            --pattern "$hashes" \
            --dir registry-release

          for asset in "$mcpb" "$metadata" "$hashes"; do
            expected="$(jq -r --arg name "$asset" \
              '.assets[] | select(.name == $name and .state == "uploaded") | .digest' \
              "$RUNNER_TEMP/hronaut-mcp-release.json")"
            if [[ ! "$expected" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Published release has no valid digest for $asset." >&2
              exit 1
            fi
            actual="sha256:$(sha256sum "registry-release/$asset" | cut -d ' ' -f 1)"
            if [[ "$actual" != "$expected" ]]; then
              echo "Downloaded $asset does not match its GitHub release digest." >&2
              exit 1
            fi
            gh attestation verify "registry-release/$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG" \
              --source-digest "$TAG_SHA" \
              --deny-self-hosted-runners
          done

          awk -v mcpb="$mcpb" -v metadata="$metadata" \
            '$2 == mcpb || $2 == metadata { print }' \
            "registry-release/$hashes" > registry-release/mcp-checksums.txt
          if [[ "$(wc -l < registry-release/mcp-checksums.txt)" -ne 2 ]]; then
            echo "Published checksum manifest does not contain exactly both MCP assets." >&2
            exit 1
          fi
          (cd registry-release && sha256sum --check mcp-checksums.txt)

          mcpb_sha="$(sha256sum "registry-release/$mcpb" | cut -d ' ' -f 1)"
          expected_identifier="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$mcpb"
          jq -e \
            --arg version "$VERSION" \
            --arg identifier "$expected_identifier" \
            --arg sha "$mcpb_sha" '
              .name == "io.github.hronaut/hronaut" and
              .version == $version and
              .repository.url == "https://github.com/hronaut/hronaut" and
              (.packages | length) == 1 and
              .packages[0].registryType == "mcpb" and
              .packages[0].identifier == $identifier and
              .packages[0].version == $version and
              .packages[0].fileSha256 == $sha and
              .packages[0].transport.type == "stdio"
            ' "registry-release/$metadata" >/dev/null

      - name: Install pinned MCP Registry publisher
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_LINUX_AMD64_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" --version

      - name: Validate and publish to the official MCP Registry
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-publisher" validate registry-release/hronaut-mcp-server.json
          "$RUNNER_TEMP/mcp-publisher" login github-oidc --registry "$REGISTRY_URL"
          "$RUNNER_TEMP/mcp-publisher" publish registry-release/hronaut-mcp-server.json

      - name: Verify public MCP Registry readback
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          metadata="registry-release/hronaut-mcp-server.json"
          name="$(jq -r '.name' "$metadata")"
          identifier="$(jq -r '.packages[0].identifier' "$metadata")"
          sha="$(jq -r '.packages[0].fileSha256' "$metadata")"
          readback="$RUNNER_TEMP/hronaut-mcp-registry-readback.json"
          endpoint="$REGISTRY_URL/v0.1/servers/io.github.hronaut%2Fhronaut/versions/$VERSION"

          for attempt in {1..12}; do
            if curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --output "$readback" "$endpoint" && \
              jq -e \
                --arg name "$name" \
                --arg version "$VERSION" \
                --arg identifier "$identifier" \
                --arg sha "$sha" '
                  .server.name == $name and
                  .server.version == $version and
                  (.server.packages | any(
                    .registryType == "mcpb" and
                    .identifier == $identifier and
                    .version == $version and
                    .fileSha256 == $sha and
                    .transport.type == "stdio"
                  ))
                ' "$readback" >/dev/null; then
              echo "Verified $name $VERSION in the public MCP Registry."
              exit 0
            fi
            if (( attempt < 12 )); then sleep 5; fi
          done

          echo "MCP Registry did not return the published Hronaut metadata." >&2
          exit 1
