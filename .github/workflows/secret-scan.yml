name: Secret scan

# Fails when a tracked file holds what looks like a credential. Fixtures with made-up values are listed in .gitleaks.toml.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan the tracked files with gitleaks
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/tracked"
          mkdir -p "$tree"
          git archive HEAD | tar -x -C "$tree"
          docker run --rm --network none -v "$tree:/repo:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /repo --no-banner --redact --config /repo/.gitleaks.toml
