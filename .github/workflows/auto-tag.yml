name: Auto Tag on Version Bump

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect a version bump
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          previous_version=""
          if git show HEAD^:package.json >/tmp/previous-package.json 2>/dev/null; then
            previous_version="$(node -p "require('/tmp/previous-package.json').version")"
          fi

          should_tag=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" || ( -n "$previous_version" && "$version" != "$previous_version" ) ]]; then
            should_tag=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "should_tag=$should_tag" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.version.outputs.should_tag == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          verify_remote_tag() {
            git tag -d "$TAG" >/dev/null 2>&1 || true
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            if [[ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Remote tag $TAG does not point at this version commit." >&2
              exit 1
            fi
            echo "Tag $TAG already exists at this version commit; no action needed."
          }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            verify_remote_tag
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG" || verify_remote_tag
          fi

      - name: Dispatch release workflow
        if: steps.version.outputs.should_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
