name: Auto Tag on Version Bump

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Detect a version bump
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          should_tag=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            should_tag=true
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ ! "$PUSH_BEFORE" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Push baseline is missing or invalid; cannot detect a version bump." >&2
              exit 1
            elif [[ "$PUSH_BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              echo "New branch has no push baseline; use workflow_dispatch for an initial release."
            else
              # A push may contain the bump followed by other commits. Fetch its
              # actual baseline when it is outside the shallow checkout.
              if ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                if ! git fetch --no-tags --depth=1 origin "$PUSH_BEFORE"; then
                  echo "Push baseline could not be fetched; cannot detect a version bump." >&2
                  exit 1
                fi
              fi
              if ! git show "$PUSH_BEFORE:package.json" > "$RUNNER_TEMP/previous-package.json"; then
                echo "Push baseline package.json could not be read; cannot detect a version bump." >&2
                exit 1
              fi
              previous_version="$(node -p "require(process.env.RUNNER_TEMP + '/previous-package.json').version")"
              if [[ -n "$previous_version" && "$version" != "$previous_version" ]]; then
                should_tag=true
              fi
            fi
          else
            echo "Unsupported auto-tag event: $EVENT_NAME" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "should_tag=$should_tag" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.version.outputs.should_tag == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          verify_remote_tag() {
            git tag -d "$TAG" >/dev/null 2>&1 || true
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            if [[ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Remote tag $TAG does not point at this version commit." >&2
              exit 1
            fi
            echo "Tag $TAG already exists at this version commit; no action needed."
          }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            verify_remote_tag
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG" || verify_remote_tag
          fi

      - name: Dispatch release workflow
        if: steps.version.outputs.should_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
