name: Probe Linux arm64 app start (temporary, removed before merge)

on:
  push:
    branches:
      - fix/macos-x64-native-binding

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/native-packages.ts install linux
      - run: npm run build:app
      - run: npx electron-builder --linux dir --x64 --arm64 --publish never
      - run: node scripts/native-packages.ts check linux dist
      - run: tar -czf "$RUNNER_TEMP/linux-arm64.tgz" -C dist linux-arm64-unpacked
      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-app
          path: ${{ runner.temp }}/linux-arm64.tgz
          retention-days: 1

  start:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: linux-arm64-app
          path: ${{ runner.temp }}/app
      - name: Install a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0t64
      - name: Write the start probe
        run: |
          cat > "$RUNNER_TEMP/start.sh" <<'SCRIPT'
          bin=$1; port=$2; label=$3
          profile=$(mktemp -d)
          file "$bin"
          HRONAUT_USER_DATA_DIR="$profile" HRONAUT_DOWNLOAD_DIR="$profile" HRONAUT_MCP_HOST=127.0.0.1 HRONAUT_MCP_PORT="$port" \
            xvfb-run -a "$bin" --no-sandbox > "$profile/out.log" 2>&1 &
          pid=$!
          for i in $(seq 1 180); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/healthz" || true)
            if [ "$code" != "000" ]; then echo "RESULT $label started: healthz answered $code after ${i}s"; kill "$pid"; exit 0; fi
            if ! kill -0 "$pid" 2>/dev/null; then echo "RESULT $label exited before answering"; grep -v '^$' "$profile/out.log" | tail -40; exit 1; fi
            sleep 1
          done
          echo "RESULT $label did not answer in 180s"; grep -v '^$' "$profile/out.log" | tail -40; kill "$pid"; exit 1
          SCRIPT
      - name: Start the new arm64 app
        run: |
          tar -xzf "$RUNNER_TEMP/app/linux-arm64.tgz" -C "$RUNNER_TEMP/app"
          bash "$RUNNER_TEMP/start.sh" "$RUNNER_TEMP/app/linux-arm64-unpacked/hronaut" 47911 new-arm64
      - name: Start the published 3.8.0 arm64 app
        run: |
          mkdir -p "$RUNNER_TEMP/old" && cd "$RUNNER_TEMP/old"
          curl -sSL -o old.AppImage https://github.com/hronaut/hronaut/releases/download/v3.8.0/hronaut-3.8.0-arm64.AppImage
          chmod +x old.AppImage && ./old.AppImage --appimage-extract > /dev/null
          bash "$RUNNER_TEMP/start.sh" "$RUNNER_TEMP/old/squashfs-root/hronaut" 47912 old-arm64 || echo "old arm64 app start exit=$?"

  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/native-packages.ts install mac
      - run: npm run build:app
      - run: npx electron-builder --mac dir --x64 --arm64 --publish never
      - run: node scripts/native-packages.ts check mac dist
