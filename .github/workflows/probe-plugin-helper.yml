name: Probe plugin headers helper
on:
  push:
    branches:
      - feat/claude-code-plugin
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Run the helper command as Claude Code does
        run: node .github/probe-plugin-helper.mjs
      - name: Install dependencies without scripts
        run: npm ci --ignore-scripts
      - name: Run the plugin tests
        run: npx vitest run tests/claude-code-plugin.test.ts
