name: Capture order diagnostic (draft only)

# This branch is an experiment, not a replacement gate. Never merge this workflow.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Independently reviewed diagnostic commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: capture-order-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture-order-diagnostic:
    if: github.ref == 'refs/heads/diagnostic/clipboard-capture-order'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 8

      - name: Verify reviewed commit and record capacity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          git merge-base --is-ancestor 6b999354e79595c69edf585ed3ce9c87d63758bf HEAD
          node scripts/diagnostics/capture-order-metadata.mjs

      - name: Run original complete shard 2 once
        run: |
          set -euo pipefail
          docker compose --file compose.test.ci.yaml build integration
          CAPTURE_IMAGE_ID="$(docker image inspect hronaut-tests-integration --format '{{.Id}}')" node scripts/diagnostics/capture-order-metadata.mjs
          docker compose --file compose.test.ci.yaml run --name "capture-order-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" integration \
            bash -ceu '
              node scripts/verify-dependency-manifest.ts
              npm run build:app
              npx playwright test --list --shard=2/8 --reporter=json > /tmp/capture-collection.json
              node scripts/diagnostics/verify-capture-collection.ts /tmp/capture-collection.json
              HRONAUT_CAPTURE_DIAGNOSTIC=1 HRONAUT_TEST_ISOLATED_DISPLAYS=1 HRONAUT_TEST_SHARD=shard-2 HRONAUT_TEST_SHARD_INDEX=2 \
                npm run test:integration:run -- --shard=2/8 \
                --workers=1 --trace=retain-on-failure \
                --reporter=./scripts/diagnostics/capture-order-reporter.ts
            '

      - name: Preserve success and failure evidence
        if: always()
        run: |
          set -euo pipefail
          container="capture-order-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker inspect "$container" >/dev/null 2>&1; then
            docker cp "$container:/workspace/capture-order-evidence/outcomes.json" ci-artifacts/outcomes.json
          fi

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capture-order-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-artifacts/outcomes.json
            ci-artifacts/provenance.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove only this experiment container
        if: always()
        run: |
          container="capture-order-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker inspect "$container" >/dev/null 2>&1; then
            docker rm --force "$container"
          fi
