name: Capture order diagnostic (draft only)

# This branch is an experiment, not a replacement gate. Never merge this workflow.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Independently reviewed diagnostic commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: capture-order-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture-order-diagnostic:
    if: github.ref == 'refs/heads/diagnostic/clipboard-capture-order'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify reviewed commit and record capacity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p ci-artifacts
          git rev-parse HEAD > ci-artifacts/source.txt
          df -h > ci-artifacts/capacity.txt
          docker info --format '{{.Driver}}' > ci-artifacts/docker-driver.txt

      - name: Run one bounded predecessor-order experiment
        run: |
          set -euo pipefail
          docker compose --file compose.test.ci.yaml build integration
          docker image inspect hronaut-tests-integration --format '{{.Id}}' > ci-artifacts/image-id.txt
          docker compose --file compose.test.ci.yaml run --name "capture-order-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" integration \
            bash -ceu '
              node scripts/verify-dependency-manifest.ts
              npm run build:app
              HRONAUT_TEST_ISOLATED_DISPLAYS=1 HRONAUT_TEST_SHARD_INDEX=2 \
                npm run test:integration:run -- --test-list scripts/diagnostics/capture-order.txt \
                --workers=1 --retries=0 --trace=on
            '

      - name: Preserve success and failure evidence
        if: always()
        run: |
          set -euo pipefail
          container="capture-order-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker inspect "$container" >/dev/null 2>&1; then
            docker cp "$container:/workspace/test-results" ci-artifacts/
            docker cp "$container:/workspace/playwright-report" ci-artifacts/
          fi

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capture-order-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Remove only this experiment container
        if: always()
        run: |
          container="capture-order-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker inspect "$container" >/dev/null 2>&1; then
            docker rm --force "$container"
          fi
