# DIAGNOSTIC DRAFT ONLY: replacement of the registered manual CI workflow on this branch.
# Must never merge. This workflow cannot admit main or publish a release.
name: OOPIF routing diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Independently admitted full commit SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  routing-observation:
    if: github.ref == 'refs/heads/diagnostic/oopif-routing-readiness'
    name: Diagnostic shard 3/8 (${{ matrix.arm }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, native-route-ready]
    steps:
      - name: Reject a dispatch outside the admitted SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]] || exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify checked-out commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Original shard ordering with bounded observers
        env:
          HRONAUT_OOPIF_DIAGNOSTIC_ARM: ${{ matrix.arm }}
        run: bash scripts/run-oopif-diagnostic.sh
      - name: Upload allowlisted synthetic fixture metadata only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oopif-${{ matrix.arm }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: oopif-safe-artifacts/*.json
          if-no-files-found: error
          retention-days: 7
