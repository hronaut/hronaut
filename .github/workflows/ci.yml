name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static validation
        run: npm run validate

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Electron integration tests in Docker
        run: bash scripts/run-integration-ci.sh

      - name: Upload Electron failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-electron-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  package-release-candidate:
    if: github.event_name == 'pull_request' && contains(github.head_ref, 'release-')
    needs:
      - validate
      - integration
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: build:linux
          - os: macos-latest
            command: build:mac
          - os: windows-latest
            command: build:win
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Build release packages
        run: npm run ${{ matrix.command }}
