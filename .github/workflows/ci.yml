name: CI

# Routine improvements defer test execution to the immutable-tag release gate.
# Keep an explicit full-check entry point for investigation or release rehearsal.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HRONAUT_TYPECHECK_JOBS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ESLint's cache is left out: its type-aware rules depend on other files, and a cached result for an unchanged
      # file hid an error that a change elsewhere caused.
      - name: Restore static-analysis state
        uses: actions/cache/restore@v6
        with:
          path: |
            tsconfig.node.tsbuildinfo
            tsconfig.web.tsbuildinfo
            tsconfig.website.tsbuildinfo
          key: static-analysis-v3-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'package.json', 'eslint.config.mjs', 'tsconfig.json', 'tsconfig.node.json', 'tsconfig.web.json', 'tsconfig.website.json') }}-${{ github.sha }}
          restore-keys: |
            static-analysis-v3-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'package.json', 'eslint.config.mjs', 'tsconfig.json', 'tsconfig.node.json', 'tsconfig.web.json', 'tsconfig.website.json') }}-

      - name: Run static validation
        run: npm run validate

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Save static-analysis state
        if: success()
        uses: actions/cache/save@v6
        with:
          path: |
            tsconfig.node.tsbuildinfo
            tsconfig.web.tsbuildinfo
            tsconfig.website.tsbuildinfo
          key: static-analysis-v3-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'package.json', 'eslint.config.mjs', 'tsconfig.json', 'tsconfig.node.json', 'tsconfig.web.json', 'tsconfig.website.json') }}-${{ github.sha }}

  integration-shard:
    name: Electron integration shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Electron integration tests in Docker
        env:
          HRONAUT_INTEGRATION_SHARD: "${{ matrix.shard }}/8"
          HRONAUT_INTEGRATION_SHARD_WORKERS: "1"
          HRONAUT_INTEGRATION_RUN_DIALOGS: "${{ matrix.shard == 1 }}"
        run: bash scripts/run-integration-ci.sh

      - name: Upload Electron failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-electron-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: integration
    if: always()
    needs: integration-shard
    runs-on: ubuntu-latest
    steps:
      - name: Verify every Electron shard passed
        env:
          SHARD_RESULT: ${{ needs.integration-shard.result }}
        run: |
          if [[ "$SHARD_RESULT" != 'success' ]]; then
            echo "Electron integration shards finished with $SHARD_RESULT." >&2
            exit 1
          fi

  package-release-candidate:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'release/')
    needs:
      - validate
      - integration
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: package:linux
          - os: windows-latest
            command: package:win
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Build release packages
        run: npm run ${{ matrix.command }}

  # The Mac packages are signed and notarized as the release's are, so the rehearsal catches a signing failure before
  # the tag. The signing secrets belong in the macos-signing environment, which admits only release tags and branches.
  package-macos-release-candidate:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'release/')
    needs:
      - validate
      - integration
    runs-on: macos-latest
    environment: macos-signing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check the macOS signing secrets
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/sign-check-macos.sh

      # No secret reaches the install and build, where every dependency's scripts and build plugins run.
      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build:app

      - name: Package, sign and notarize the Mac packages
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY")
          npx electron-builder --mac --publish never -c.mac.forceCodeSigning=true
          bash scripts/notarize-and-verify-macos.sh
