name: Scoop package smoke

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Published release tag to verify (leave empty to test a local build)
        required: false
        type: string

permissions:
  contents: read
  attestations: read

concurrency:
  group: scoop-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Windows portable through Scoop
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Download and verify published Windows portable package
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          ./scripts/download-scoop-release.ps1 -Tag $env:RELEASE_TAG
      - name: Build unsigned Windows portable package
        if: inputs.release-tag == ''
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: pwsh
        run: |
          npm ci
          npm run build
          npx electron-builder --win portable --x64 --publish never
      - name: Exercise the selected package through Scoop
        shell: pwsh
        run: ./scripts/scoop-portable-smoke.ps1
