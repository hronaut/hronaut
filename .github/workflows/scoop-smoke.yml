name: Scoop package smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scoop-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Windows portable through Scoop
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Build unsigned Windows portable package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: pwsh
        run: |
          npm ci
          npm run build
          npx electron-builder --win portable --x64 --publish never
      - name: Exercise the local manifest without downloading a release asset
        shell: pwsh
        run: ./scripts/scoop-portable-smoke.ps1
