appId: com.hronaut.hronaut
productName: Hronaut
copyright: Copyright © 2026 Hronaut

directories:
  buildResources: build

files:
  - out/**
  - package.json
  - LICENSE
  - NOTICE
  - THIRD_PARTY_NOTICES.md
  - node_modules/**

asar: true
npmRebuild: false

# Electron Fuses, flipped in the packaged binary before signing (https://www.electronjs.org/docs/latest/tutorial/fuses).
# Hronaut never runs its executable as Node, never needs NODE_OPTIONS or the Node inspector in a packaged build, and loads
# its code only from app.asar, which macOS and Windows now check against the hash electron-builder records. Release
# builds for macOS are signed after the flip; unsigned local and preflight builds still need the Apple Silicon binary's
# fresh ad-hoc signature. The manual native preflights turn the inspector back on for their own candidate, because
# Playwright drives the packaged app through it.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  resetAdHocDarwinSignature: true

win:
  executableName: Hronaut
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: hronaut-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

portable:
  artifactName: hronaut-${version}-${arch}-windows-portable.${ext}

mac:
  minimumSystemVersion: "13.0"
  icon: build/icon.png
  category: public.app-category.utilities
  # Signed with the Developer ID certificate in CSC_LINK and notarized with the App Store Connect key in APPLE_API_KEY,
  # APPLE_API_KEY_ID and APPLE_API_ISSUER (see release.yml). Without them, as with CSC_IDENTITY_AUTO_DISCOVERY=false,
  # the build stays unsigned and skips notarization.
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Hronaut lets websites use the camera after user approval.
    NSMicrophoneUsageDescription: Hronaut lets websites use the microphone after user approval.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

dmg:
  artifactName: hronaut-${version}-${arch}.${ext}
  # The disk image carries the same signature as the app, so it can be notarized and stapled too.
  sign: true

linux:
  icon: build/icons
  syncDesktopName: true
  category: Network
  description: Visible, persistent browser for coding agents
  desktop:
    entry:
      GenericName: Browser MCP
      Keywords: browser;MCP;AI;coding agent;automation;QA;testing;
  maintainer: Hronaut
  executableName: hronaut
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64

appImage:
  artifactName: hronaut-${version}-${arch}.${ext}

deb:
  artifactName: hronaut-${version}-${arch}.${ext}

rpm:
  artifactName: hronaut-${version}-${arch}.${ext}

publish:
  provider: github
  owner: hronaut
  repo: hronaut
